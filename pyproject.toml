[build-system]
# A list of packages that are needed to build your package:
requires = ["setuptools>= 77.0.3"] # REQUIRED if [build-system] table is used
# The name of the Python object that frontends will use to perform the build:
build-backend = "setuptools.build_meta" # If not defined, then legacy behavior can happen.

[project]
name = "clumsygrad"
version = "1.0.0"
authors = [
  { name="Sayan Gupta" },
]

maintainers = [
  { name="Sayan Gupta" },
]

description = "A minimal python library for automatic differentiation, built on top of NumPy."
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",

  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]

# The license for the project
license = "MIT"
license-files = ["LICENSE"]

# metadata for the package
keywords = ["autograd", "automatic-differentiation", "machine-learning"]
dependencies = ["numpy>=2.5.0"]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "psutil>=7.2.2",
  "ruff>=0.14.0",
  "mypy>=1.14",
  "pre-commit>=4.0.0",
]
docs = [
  "sphinx>=9.1.0",
  "shibuya>=2026.7.12",
]

# List URLs that are relevant to the project
[project.urls]
Homepage = "https://github.com/ggsayan/ClumsyGrad"
Issues = "https://github.com/ggsayan/ClumsyGrad/issues"

[tool.setuptools.package-data]
clumsygrad = ["py.typed"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
