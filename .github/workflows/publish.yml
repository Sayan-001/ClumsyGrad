name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  check-version:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      local_version: ${{ steps.local.outputs.version }}
      should_publish: ${{ steps.compare.outputs.should_publish }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Read version from pyproject.toml
        id: local
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compare against latest published version on PyPI
        id: compare
        env:
          LOCAL_VERSION: ${{ steps.local.outputs.version }}
        run: |
          status=$(curl -s -o /tmp/pypi.json -w "%{http_code}" https://pypi.org/pypi/clumsygrad/json)
          if [ "$status" = "200" ]; then
            published=$(python -c "import json; print(json.load(open('/tmp/pypi.json'))['info']['version'])")
          else
            published="none"
          fi
          echo "Published version: $published / Local version: $LOCAL_VERSION"
          if [ "$published" != "$LOCAL_VERSION" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
